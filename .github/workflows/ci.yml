name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Native iPhone build and tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          device="$(xcrun simctl list devices available -j | \
            ruby -rjson -e 'puts JSON.parse(STDIN.read)["devices"].values.flatten.find { |d| d["name"].start_with?("iPhone") }["udid"]')"
          test -n "$device"
          echo "id=$device" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          xcodebuild \
            -project ios/UpkeepLog.xcodeproj \
            -scheme UpkeepLog \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            CODE_SIGNING_ALLOWED=NO \
            clean test
