name: upkeep_log
description: "Local-first household maintenance scheduling and history."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.1 <4.0.0'

dependencies:
  drift: 2.34.3
  flutter:
    sdk: flutter
  path_provider: 2.1.5
  # Pin the Android implementation so lockfile resolution remains reproducible
  # and does not silently add a new JNI toolchain between builds.
  path_provider_android: 2.2.15
  sqlite3: 3.5.2

dev_dependencies:
  build_runner: 2.16.0
  drift_dev: 2.34.5
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
